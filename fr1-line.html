<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>第1時｜直線を境界線とする領域</title>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<style>
  :root{
    --brown:#B5651D; --orange:#D89A32; --deep:#8B4A15;
    --ink:#222222; --muted:#6B6257; --paper:#FFFFFF; --tint:#FDF3E3;
    --blue:#1E4FD8; --red:#CC2222;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--brown);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
    color:var(--ink); line-height:1.7; padding:10px;
  }
  .sheet{background:var(--paper);border-radius:4px;max-width:1100px;margin:0 auto;overflow:hidden}
  header{padding:18px 22px 14px;border-bottom:3px solid var(--orange)}
  .eyebrow{font-size:13px;letter-spacing:.22em;color:var(--deep);font-weight:700;margin:0 0 4px}
  h1{font-size:26px;margin:0;font-weight:800;letter-spacing:.02em}
  /* 予想 → 確認 → 説明 の進行バー：この単元の方法観そのもの */
  .steps{display:flex;gap:0;margin:14px 0 0;font-size:13px;font-weight:700}
  .steps span{flex:1;text-align:center;padding:7px 4px;background:#F2EAE0;color:var(--muted);
    border-right:2px solid var(--paper)}
  .steps span:last-child{border-right:0}
  .steps span.on{background:var(--orange);color:#fff}
  main{display:grid;grid-template-columns:300px 1fr;gap:0}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  aside{padding:20px 20px 24px;background:var(--tint);border-right:1px solid #EADFCB}
  @media (max-width:900px){aside{border-right:0;border-bottom:1px solid #EADFCB}}
  h2{font-size:15px;margin:0 0 10px;letter-spacing:.1em;color:var(--deep)}
  .q{font-size:17px;font-weight:700;margin:0 0 16px}
  .cases{display:flex;flex-direction:column;gap:8px}
  .cases button{
    font:inherit;font-size:15px;font-weight:700;text-align:left;padding:11px 13px;cursor:pointer;
    background:#fff;color:var(--ink);border:2px solid #E2D3BC;border-radius:3px;transition:.15s}
  .cases button:hover{border-color:var(--orange)}
  .cases button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
  .cases button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .hint{margin:18px 0 0;font-size:13px;color:var(--muted);line-height:1.75}
  .stage{position:relative;padding:16px}
  .ggb-frame{width:100%}
  /* 署名要素：予想を書くまで画面を開けない */
  .gate{position:absolute;inset:16px;background:var(--paper);z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;
    border:2px dashed var(--orange)}
  .gate.hidden{display:none}
  .gate p{font-size:20px;font-weight:800;margin:0 0 6px;max-width:26em}
  .gate small{display:block;font-size:14px;color:var(--muted);margin-bottom:26px;font-weight:400}
  .gate button{font:inherit;font-size:16px;font-weight:800;padding:14px 30px;cursor:pointer;
    background:var(--orange);color:#fff;border:0;border-radius:3px}
  .gate button:hover{background:var(--deep)}
  .gate button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
  footer{padding:12px 22px 16px;font-size:12.5px;color:var(--muted);border-top:1px solid #EADFCB}
  code{background:#F2EAE0;padding:1px 5px;border-radius:2px;font-size:.94em}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="sheet">
  <header>
    <p class="eyebrow">第 1 時</p>
    <h1>どちら側かを目で確かめる</h1>
    <div class="steps"><span class="on" id="s1">① 予想する</span><span id="s2">② 操作して確かめる</span><span id="s3">③ 理由を言葉にする</span></div>
  </header>

  <main>
    <aside>
      <h2>調べる不等式</h2>
      <p class="q">赤い点をドラッグすると、代入した結果が画面に出ます。教科書 p.113〜115 の例です。</p>
      <div class="cases" id="cases"></div>
      <p class="hint">
        境界線はすべて実線で描かれます。含むか含まないかは、不等号を見て 言葉で 判断してください。
        入力欄に自分で <code>y &gt; -x + 2</code> のように打ち込んでも構いません。
      </p>
    </aside>

    <div class="stage">
      <div class="gate" id="gate">
        <p>どこが塗られるか、ノートに予想を書きましたか。</p>
        <small>先に画面を見ると、考える機会がなくなります。</small>
        <button id="gateBtn">予想を書いた。確認する</button>
      </div>
      <div class="ggb-frame"><div id="ggb"></div></div>
    </div>
  </main>

  <footer>境界で平面は 2 つに分かれる。どちらが領域かは、代表点を 1 つ代入して決める。</footer>
</div>

<script>
var api = null;

// GeoGebra の SetColor は 0〜1 の小数で指定する（0〜255 だと白飛びする）
var BLUE  = "0.12, 0.31, 0.85";
var RED   = "0.80, 0.13, 0.13";
var DEEP  = "0.55, 0.29, 0.08";

var CASES = [
  { label: "y > −x + 2　（p.113）",
    ineq: "ineq: y > -x + 2", bound: "q1: y = -x + 2",
    point: "P=(3,3)",
    test: "y(P) > -x(P) + 2",
    view: [-4,-3,8,5], anchor: [-3.7, 4.5] },
  { label: "y < −x + 2　（p.114）",
    ineq: "ineq: y < -x + 2", bound: "q1: y = -x + 2",
    point: "P=(3,-1)",
    test: "y(P) < -x(P) + 2",
    view: [-4,-3,8,5], anchor: [-3.7, 4.5] },
  { label: "例14　2x + y − 3 ≦ 0",
    ineq: "ineq: 2*x + y - 3 <= 0", bound: "q1: 2*x + y - 3 = 0",
    point: "P=(0,0)",
    test: "2*x(P) + y(P) - 3 <= 0",
    view: [-4,-4,8,4], anchor: [-3.7, 3.5] },
  { label: "例15　x > 2",
    ineq: "ineq: x > 2", bound: "q1: x = 2",
    point: "P=(3,1)",
    test: "x(P) > 2",
    view: [-4,-4,8,4], anchor: [-3.7, 3.5] },
  { label: "練習37(2)　2x − 3y + 6 > 0",
    ineq: "ineq: 2*x - 3*y + 6 > 0", bound: "q1: 2*x - 3*y + 6 = 0",
    point: "P=(0,0)",
    test: "2*x(P) - 3*y(P) + 6 > 0",
    view: [-7.5,-5,7.5,5], anchor: [-7.2, 4.5] }
];

function run(lines){ lines.forEach(function(c){ try{ api.evalCommand(c); }catch(e){} }); }
function drop(names){ names.forEach(function(n){ try{ api.deleteObject(n); }catch(e){} }); }

function load(i){
  if(!api) return;
  var c = CASES[i];
  drop(["judge","ineq","q1","P"]);
  run([
    "ZoomIn(" + c.view.join(",") + ")",
    "SetAxesRatio(1,1)",
    c.ineq,
    "SetColor(ineq, " + BLUE + ")",
    "SetFilling(ineq, 0.22)",
    "SetLineThickness(ineq, 0)",
    "ShowLabel(ineq, false)",
    c.bound,
    "SetColor(q1, " + BLUE + ")",
    "SetLineThickness(q1, 6)",
    "SetLineStyle(q1, 0)",
    "ShowLabel(q1, false)",
    c.point,
    "SetColor(P, " + RED + ")",
    "SetPointSize(P, 8)",
    'judge = If(' + c.test + ', "○ 成り立つ → この側が領域", "× 成り立たない → 反対側")',
    "SetCoords(judge, " + c.anchor.join(", ") + ")",
    "SetColor(judge, " + DEEP + ")"
  ]);
  document.querySelectorAll("#cases button").forEach(function(b, j){
    b.setAttribute("aria-pressed", j === i ? "true" : "false");
  });
  document.getElementById("s2").classList.add("on");
}

CASES.forEach(function(c, i){
  var b = document.createElement("button");
  b.textContent = c.label;
  b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", function(){ load(i); });
  document.getElementById("cases").appendChild(b);
});

document.getElementById("gateBtn").addEventListener("click", function(){
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("s2").classList.add("on");
});

var params = {
  appName: "classic",
  width: 780, height: 520,
  showToolBar: false, showMenuBar: false, showAlgebraInput: true,
  algebraInputPosition: "bottom",
  perspective: "G", showResetIcon: false, enableRightClick: false,
  enableShiftDragZoom: true, language: "ja",
  scaleContainerClass: "ggb-frame", allowUpscale: true, autoHeight: false,
  appletOnLoad: function(a){ api = a; load(0); }
};
window.addEventListener("load", function(){ new GGBApplet(params, true).inject("ggb"); });
</script>
</body>
</html>
