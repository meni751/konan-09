<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>第3時｜直線群の通過領域</title>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<style>
  :root{
    --brown:#B5651D; --orange:#D89A32; --deep:#8B4A15;
    --ink:#222222; --muted:#6B6257; --paper:#FFFFFF; --tint:#FDF3E3;
    --blue:#1E4FD8; --red:#CC2222;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--brown);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
    color:var(--ink);line-height:1.7;padding:10px}
  .sheet{background:var(--paper);border-radius:4px;max-width:1100px;margin:0 auto;overflow:hidden}
  header{padding:18px 22px 14px;border-bottom:3px solid var(--orange)}
  .eyebrow{font-size:13px;letter-spacing:.22em;color:var(--deep);font-weight:700;margin:0 0 4px}
  h1{font-size:26px;margin:0;font-weight:800;letter-spacing:.02em}
  .steps{display:flex;margin:14px 0 0;font-size:13px;font-weight:700}
  .steps span{flex:1;text-align:center;padding:7px 4px;background:#F2EAE0;color:var(--muted);border-right:2px solid var(--paper)}
  .steps span:last-child{border-right:0}
  .steps span.on{background:var(--orange);color:#fff}
  main{display:grid;grid-template-columns:300px 1fr}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  aside{padding:20px;background:var(--tint);border-right:1px solid #EADFCB}
  @media (max-width:900px){aside{border-right:0;border-bottom:1px solid #EADFCB}}
  h2{font-size:15px;margin:0 0 6px;letter-spacing:.1em;color:var(--deep)}
  h2+p{margin:0 0 14px;font-size:14px;color:var(--muted)}
  .cases{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .cases button{font:inherit;font-size:15px;font-weight:700;text-align:left;padding:11px 13px;cursor:pointer;
    background:#fff;color:var(--ink);border:2px solid #E2D3BC;border-radius:3px;transition:.15s}
  .cases button:hover{border-color:var(--orange)}
  .cases button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
  .cases button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .kbar{display:flex;gap:8px;margin-bottom:10px}
  .kbar button{flex:1;font:inherit;font-size:14px;font-weight:700;padding:10px 6px;cursor:pointer;
    background:var(--orange);color:#fff;border:0;border-radius:3px}
  .kbar button:hover{background:var(--deep)}
  .reveal{width:100%;font:inherit;font-size:14px;font-weight:800;padding:12px 6px;cursor:pointer;
    background:#fff;color:var(--deep);border:2px solid var(--deep);border-radius:3px}
  .reveal:hover{background:var(--deep);color:#fff}
  .hint{margin:16px 0 0;font-size:13px;color:var(--muted);line-height:1.75}
  .stage{position:relative;padding:16px}
  .ggb-frame{width:100%}
  .gate{position:absolute;inset:16px;background:var(--paper);z-index:5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:30px;border:2px dashed var(--orange)}
  .gate.hidden{display:none}
  .gate p{font-size:20px;font-weight:800;margin:0 0 6px;max-width:28em}
  .gate small{display:block;font-size:14px;color:var(--muted);margin-bottom:26px;font-weight:400}
  .gate button{font:inherit;font-size:16px;font-weight:800;padding:14px 30px;cursor:pointer;
    background:var(--orange);color:#fff;border:0;border-radius:3px}
  .gate button:hover{background:var(--deep)}
  footer{padding:12px 22px 16px;font-size:12.5px;color:var(--muted);border-top:1px solid #EADFCB}
  code{background:#F2EAE0;padding:1px 5px;border-radius:2px;font-size:.94em}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="sheet">
  <header>
    <p class="eyebrow">第 3 時</p>
    <h1>直線群の通過領域</h1>
    <div class="steps"><span class="on">① 予想する</span><span id="s2">② t を動かす</span><span id="s3">③ 式で確かめる</span></div>
  </header>

  <main>
    <aside>
      <h2>直線群</h2>
      <p>t がすべての実数を動くときの直線</p>
      <div class="cases" id="cases"></div>
      <div class="kbar">
        <button id="play">t を動かす</button>
        <button id="stop">止める</button>
      </div>
      <button class="reveal" id="reveal">答えの領域を重ねる</button>
      <p class="hint">
        灰色の細い直線は、t をいくつも代入して描いたものです。
        塗り残される部分の<strong>境界</strong>に、どんな曲線が現れますか。
      </p>
    </aside>

    <div class="stage">
      <div class="gate" id="gate">
        <p>この直線たちが通らない場所はどこだと思いますか。</p>
        <small>境界に現れる曲線を予想してノートに描いてから開いてください。</small>
        <button id="gateBtn">予想を描いた。確認する</button>
      </div>
      <div class="ggb-frame"><div id="ggb"></div></div>
    </div>
  </main>

  <footer>点 (X, Y) が通過範囲に入る ⇔ その点を通る t が存在する ⇔ t の方程式が実数解をもつ。</footer>
</div>

<script>
var api = null;
var shown = false;

// GeoGebra の SetColor は 0〜1 の小数で指定する（0〜255 だと白飛びする）
var BLUE = "0.12, 0.31, 0.85";
var RED  = "0.80, 0.13, 0.13";
var GREY = "0.55, 0.55, 0.55";

var CASES = [
  { label: "y = 2tx − t²",
    fam:  "fam = Sequence(2*s*x - s^2, s, -3, 3, 0.2)",
    mov:  "m: y = 2*t*x - t^2",
    ans:  "ans: y <= x^2",
    view: [-4, -3.5, 4, 5.5],
    trange: [-3, 3] },
  { label: "y = tx − t² + 1",
    fam:  "fam = Sequence(s*x - s^2 + 1, s, -3, 3, 0.2)",
    mov:  "m: y = t*x - t^2 + 1",
    ans:  "ans: y <= x^2/4 + 1",
    view: [-5, -3.5, 5, 6],
    trange: [-3, 3] }
];

function run(lines){ lines.forEach(function(c){ try{ api.evalCommand(c); }catch(e){} }); }
function drop(names){ names.forEach(function(n){ try{ api.deleteObject(n); }catch(e){} }); }

function load(i){
  if(!api) return;
  var c = CASES[i];
  shown = false;
  document.getElementById("reveal").textContent = "答えの領域を重ねる";
  drop(["ans","m","fam","t"]);
  run([
    "ZoomIn(" + c.view.join(",") + ")",
    "t = Slider(" + c.trange[0] + ", " + c.trange[1] + ", 0.02)",
    "SetValue(t, 0)",
    "SetCoords(t, 25, 30)",
    "SetFixed(t, true)",
    c.fam,
    "SetColor(fam, " + GREY + ")",
    "SetLineThickness(fam, 2)",
    "ShowLabel(fam, false)",
    c.mov,
    "SetColor(m, " + RED + ")",
    "SetLineThickness(m, 8)",
    "ShowLabel(m, false)"
  ]);
  document.querySelectorAll("#cases button").forEach(function(b, j){
    b.setAttribute("aria-pressed", j === i ? "true" : "false");
  });
  document.getElementById("s2").classList.add("on");
  current = i;
}

var current = 0;

CASES.forEach(function(c, i){
  var b = document.createElement("button");
  b.textContent = c.label;
  b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", function(){ load(i); });
  document.getElementById("cases").appendChild(b);
});

document.getElementById("reveal").addEventListener("click", function(){
  if(!api) return;
  if(shown){
    drop(["ans"]);
    shown = false;
    this.textContent = "答えの領域を重ねる";
  }else{
    run([
      CASES[current].ans,
      "SetColor(ans, " + BLUE + ")",
      "SetFilling(ans, 0.22)",
      "SetLineThickness(ans, 7)",
      "ShowLabel(ans, false)"
    ]);
    shown = true;
    this.textContent = "答えの領域を消す";
    document.getElementById("s3").classList.add("on");
  }
});

document.getElementById("play").addEventListener("click", function(){
  if(!api) return;
  api.setAnimating("t", true); api.startAnimation();
});
document.getElementById("stop").addEventListener("click", function(){
  if(!api) return;
  api.stopAnimation();
});
document.getElementById("gateBtn").addEventListener("click", function(){
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("s2").classList.add("on");
});

var params = {
  appName: "classic",
  width: 780, height: 520,
  showToolBar: false, showMenuBar: false, showAlgebraInput: true,
  algebraInputPosition: "bottom",
  perspective: "G", showResetIcon: false, enableRightClick: false,
  enableShiftDragZoom: true, language: "ja",
  scaleContainerClass: "ggb-frame", allowUpscale: true, autoHeight: false,
  appletOnLoad: function(a){ api = a; load(0); }
};
window.addEventListener("load", function(){ new GGBApplet(params, true).inject("ggb"); });
</script>
</body>
</html>
